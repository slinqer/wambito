tags:
  golden:
    # Golden images are pixels rendered by the machine that made them (this repo's: macOS). The CI
    # job runs on Linux, where text and shadows rasterize a little differently, so it skips them
    # with `flutter test --exclude-tags golden`. Update them locally with
    # `flutter test --update-goldens --tags golden`.
  stack:
    # The phone's vault against the real dev stack (test_stack/, scripts/run-vault-e2e.sh). It lives
    # outside test/, so `flutter test` never picks it up; run it with `--tags stack`.
