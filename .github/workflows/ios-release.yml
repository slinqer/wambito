name: iOS release

# A `mobile-v*` tag (docs/mobile/release.md) builds the iOS app and uploads it to App Store Connect;
# TestFlight and App Review are done by hand (docs/mobile/ios.md).
on:
  push:
    tags: ["mobile-v*"]

jobs:
  ios-release:
    runs-on: macos-latest
    timeout-minutes: 60
    # The six secrets live in this environment (docs/mobile/ios.md).
    environment: app-store
    permissions:
      contents: read
    concurrency:
      group: ios-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      KEYCHAIN_PATH: ${{ runner.temp }}/wambito-signing.keychain-db
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Flutter version
        id: flutter-version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # The team id is a build setting, git-ignored in the repo (scripts/check-ios-signing.sh).
      - name: Write the signing settings
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          umask 077
          printf 'DEVELOPMENT_TEAM = %s\n' "$IOS_TEAM_ID" > ios/Flutter/Signing.xcconfig
      - name: Import the distribution certificate into a temporary keychain
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          umask 077
          keychain_password="$(openssl rand -hex 24)"
          cert_file="$RUNNER_TEMP/dist-cert.p12"
          printf '%s' "$IOS_DIST_CERT_P12" | base64 --decode > "$cert_file"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security import "$cert_file" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$KEYCHAIN_PATH" > /dev/null
          rm -f "$cert_file"
      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
      # `flutter build ipa` takes no App Store Connect key, so Flutter only prepares the project
      # (version, Generated.xcconfig) and xcodebuild archives and exports with the key, which lets
      # Xcode create and fetch the provisioning profile (automatic signing).
      - name: Prepare the project
        run: flutter build ios --release --config-only
      - name: Archive
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Export the ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Upload to App Store Connect
        run: |
          ipa=(build/ios/ipa/*.ipa)
          [ "${#ipa[@]}" -eq 1 ] || { echo "::error::expected one .ipa, found ${#ipa[@]}"; exit 1; }
          xcrun altool --upload-app --type ios --file "${ipa[0]}" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove the keychain and the keys
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/dist-cert.p12" ios/Flutter/Signing.xcconfig
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
