name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Storybook tests in `pnpm test` run in Vitest browser mode on Playwright Chromium.
      - run: pnpm --filter @wambito/web exec playwright install --with-deps chromium
      # Wambito depends on nothing at the founder's personal domain (docs/superpowers keeps history).
      - run: "! git grep -n -I -i -e 'anderson''laverde' -- . ':!docs/superpowers'"
      # No old app name or old mascot name (see the guard script) outside .github/name-allowlist.txt.
      - run: scripts/check-old-name.sh
      # The guard's own test: each allowlist reason must be one the guard knows.
      - run: scripts/test-check-old-name.sh
      # Every native channel and method the Dart code calls exists on both phones (Kotlin and Swift),
      # unless .github/channel-allowlist.txt says why not.
      - run: scripts/check-channels.sh
      - run: scripts/test-check-channels.sh
      - run: pnpm lint
      # Generated files must be committed as generated. tokens.css comes from the design system's
      # tokens.json: run `pnpm --filter @wambito/web tokens` and commit it.
      - run: pnpm --filter @wambito/web tokens
      - run: git diff --exit-code apps/web/app/styles/tokens.css
      # The web's API types are generated from the API's OpenAPI document (built from the app, no
      # server or database). Fails when apps/web/app/api/schema.d.ts is stale: run
      # `pnpm --filter @wambito/web api:types` (with the API running) or add --file, and commit it.
      - run: pnpm --filter @wambito/web api:types --file
      - run: git diff --exit-code apps/web/app/api/schema.d.ts
      # The MCP server's copy of the same types: `pnpm --filter @wambito/mcp api:types`.
      - run: pnpm --filter @wambito/mcp api:types
      - run: git diff --exit-code apps/mcp/src/api/schema.d.ts
      - run: pnpm typecheck
      # Unit, API integration and Storybook tests. Integration tests start Postgres with
      # testcontainers (Docker is available on the runner); the Storybook stories run after them in
      # Chromium (apps/web/vitest.config.ts).
      - run: pnpm test
      # The personal install's backup retention (no dump older than 14 days), on fake dumps.
      - run: deploy/personal/test-retention.sh
      # The R2 copy of the backups (only .age files go up, keys never on the command line), against
      # a fake rclone.
      - run: deploy/personal/test-r2.sh
      # The server's automatic deploy (CI gate, exact commit, rollback), against a local repository
      # and a fake GitHub API.
      - run: deploy/personal/test-auto-deploy.sh
      # The unit installs (wambito-* units, the old ones stopped and removed first), against stub
      # sudo, systemctl and launchctl and a temporary unit folder.
      - run: deploy/personal/test-install-units.sh
      # The web container's start-up files (/.well-known/assetlinks.json and apple-app-site-association).
      - run: deploy/personal/test-web-entrypoint.sh
      # The web container's Caddy config (client address to the API and MCP, routes), in Docker.
      - run: deploy/personal/test-caddy.sh
      # The personal install's two ways (tunnel by default, direct with COMPOSE_FILE): compose files,
      # published ports, Caddy config and services started (`docker compose config`, needs jq).
      - run: deploy/personal/test-compose-files.sh
      # The version /health reports (the root package.json's plus the commit), on throwaway repos.
      - run: deploy/personal/test-version.sh

  e2e:
    runs-on: ubuntu-latest
    env:
      # The suite's "now" (apps/web/e2e/helpers.ts): the API's clock is pinned to it.
      E2E_NOW: "2026-10-21T15:00:00Z"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wambito/web exec playwright install --with-deps chromium
      # The dev stack: Postgres, Mailpit and the API (which applies the migrations on start), with
      # the development defaults. The e2e's global setup waits for the API and Mailpit.
      - run: cp .env.example .env
      - run: docker compose up -d --build
      # The admin the admin panel's e2e signs in with (dev-admin, in ADMIN_USER_IDS by default),
      # once the API answers (it applies the migrations first, so the tables exist).
      - run: timeout 120 sh -c 'until curl -sf http://localhost:3000/api/health; do sleep 1; done'
      - run: docker compose exec -T api pnpm --filter @wambito/api seed:admin
      # The encrypted-preview account the vault e2e signs in with (preview-e2e, in
      # E2E_PREVIEW_USER_IDS by default); the spec resets it again before it runs.
      - run: docker compose exec -T api pnpm --filter @wambito/api seed:e2e-preview
      # App flows against `pnpm dev` (Playwright starts it) and the stack, at phone and desktop
      # sizes, axe on every screen included.
      - run: pnpm --filter @wambito/web e2e
      - if: failure()
        run: docker compose logs api
      # The landing as it ships, built three ways: the full site, the landing-only release without
      # an app, and the landing-only release with one. Each script builds first.
      - run: pnpm --filter @wambito/web e2e:landing
      - run: pnpm --filter @wambito/web e2e:landing-only
      - run: pnpm --filter @wambito/web e2e:landing-only-app
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  # Publishes the landing (wambito.com, docs/deploy/landing.md) after every merge
  # into main, once both jobs above pass: what is on main is what the site shows. Pull requests
  # never get here, so they never touch the live site. Needs two repository secrets, set by the
  # owner: CLOUDFLARE_API_TOKEN (Cloudflare template "Edit Cloudflare Workers", limited to the
  # account that holds wambito.com) and CLOUDFLARE_ACCOUNT_ID.
  deploy-landing:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    # One publish at a time; a newer merge waits for the one in flight instead of racing it.
    concurrency:
      group: deploy-landing
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (docs/deploy/landing.md, 'Publishing on merge')."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The landing-only release, built as docs/deploy/landing.md says.
      - run: pnpm --filter @wambito/web build:landing
        env:
          VITE_SITE_URL: https://wambito.com
          VITE_APP_URL: https://app.wambito.com
      # From deploy/landing, so wrangler reads its config there and does not auto-configure the app.
      - run: npx --yes wrangler@4.151.3 deploy
        working-directory: deploy/landing

  # Whether the Android app's job below has anything to check: the app itself, or an input of its
  # generated code (the design tokens; the API contract: the API's source, its dependencies and the
  # document builder), the shared core, or this workflow.
  mobile-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'apps/api/src/**'
              - 'apps/api/package.json'
              - 'apps/web/scripts/gen-api.ts'
              - 'apps/web/app/i18n/messages/*.json'
              - 'apps/web/public/wambi/capture-step*.webp'
              - 'docs/design/system/project/tokens.json'
              - 'packages/core/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  # The Android app (apps/mobile, docs/mobile/setup.md). Skipped, which counts as passing, when
  # nothing it depends on changed.
  mobile:
    needs: mobile-changes
    if: needs.mobile-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A new push to a pull request replaces the run in flight; main's runs all finish.
    concurrency:
      group: mobile-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      # Node and pnpm build the API's OpenAPI document for the client staleness check.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Read the pinned Flutter version
        id: flutter-version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      # Exactly the locked versions (pubspec.lock pins every package, transitive ones included).
      # Also generates AppLocalizations from lib/l10n/*.arb.
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      # Golden images (tag `golden`, apps/mobile/dart_test.yaml) are pixels from the Mac that made
      # them; this Linux runner rasterizes text and shadows a little differently, so it skips them.
      - run: flutter test --exclude-tags golden
      # Generated files must be committed as generated: run the generator and commit its output.
      - name: lib/theme/tokens.g.dart is up to date
        run: |
          dart run scripts/gen-tokens.dart
          if [ -n "$(git status --porcelain -- lib/theme/tokens.g.dart)" ]; then
            git diff -- lib/theme/tokens.g.dart
            echo "::error::lib/theme/tokens.g.dart is stale: run 'dart run scripts/gen-tokens.dart' in apps/mobile and commit it."
            exit 1
          fi
      - name: ios/Runner/*.lproj/Notices.strings is up to date
        run: |
          dart run scripts/gen-ios-strings.dart
          if [ -n "$(git status --porcelain -- ios/Runner/es.lproj/Notices.strings ios/Runner/en.lproj/Notices.strings ios/Runner/it.lproj/Notices.strings ios/Runner/pt.lproj/Notices.strings)" ]; then
            git diff -- ios/Runner
            echo "::error::ios/Runner/*.lproj/Notices.strings is stale: run 'dart run scripts/gen-ios-strings.dart' in apps/mobile and commit it."
            exit 1
          fi
      - name: lib/api/gen is up to date
        run: |
          scripts/gen-api.sh
          if [ -n "$(git status --porcelain -- lib/api/gen)" ]; then
            git status --short -- lib/api/gen
            git diff --stat -- lib/api/gen
            echo "::error::lib/api/gen is stale: run apps/mobile/scripts/gen-api.sh and commit it."
            exit 1
          fi
      # The release scripts' own tests (version scheme, certificate fingerprint format) and the
      # F-Droid metadata's limits (title, descriptions, changelogs, screenshots).
      - run: scripts/test-release.sh
      - run: scripts/check-fastlane.sh
      # build-native-deps.sh's arguments (--abi), checked before it needs its tools or sources.
      - run: scripts/test-build-native-deps-args.sh
      # build-sherpa-onnx.sh (the precise model from source, F-Droid arm64-v8a): its arguments and
      # its pinned sources' format.
      - run: scripts/test-build-sherpa-onnx-args.sh
      # fetch-sherpa-onnx.sh (the precise voice model's runtime) refuses a file with the wrong SHA-256.
      - run: scripts/test-fetch-sherpa-onnx.sh
      # The F-Droid recipe still agrees with .flutter-version, build-native-deps.sh's and
      # build-sherpa-onnx.sh's pinned revisions and NDK, and gradle-fdroid.lockfile is gradle.lockfile with the two -src lines
      # (docs/mobile/fdroid.md). Their test shows each fails on a deliberate mismatch.
      - run: scripts/test-fdroid-checks.sh
      - run: scripts/check-fdroid-recipe.sh
      - run: scripts/check-fdroid-lock.sh

  # The iOS app (docs/mobile/ios.md): the signing guard, the Swift package's tests and an unsigned
  # release build. Same filter as the Android jobs, so it is skipped when nothing it depends on
  # changed.
  ios:
    needs: mobile-changes
    if: needs.mobile-changes.outputs.mobile == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    concurrency:
      group: ios-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Flutter version
        id: flutter-version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: The signing guard catches a team id
        run: scripts/test-check-ios-signing.sh
      - name: No team id in the iOS project
        run: scripts/check-ios-signing.sh
      - name: Swift package tests
        run: swift test --package-path ios/WambitoNative
      - name: Release build without signing
        run: flutter build ios --release --no-codesign

  # The Android app's builds, beside the quick checks above (each took as long as the other, one
  # after the other): no Google dependencies, the debug build and the Kotlin tests, and the release
  # as scripts/release.sh makes it. Same filter, so it is skipped (which counts as passing) when
  # nothing the app depends on changed.
  mobile-build:
    needs: mobile-changes
    if: needs.mobile-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: mobile-build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Read the pinned Flutter version
        id: flutter-version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-build-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'apps/mobile/pubspec.lock') }}
          restore-keys: gradle-build-${{ runner.os }}-
      # sherpa-onnx's AAR (GitHub release, SHA-256 checked) into android/third_party/m2, where Gradle
      # looks for it; every step below that runs Gradle needs it. Not in the F-Droid build.
      - run: scripts/fetch-sherpa-onnx.sh
      # No Google Play Services, Firebase, ML Kit, Play Core, ARCore… in any variant's resolved
      # dependencies or in the Gradle build files; then the same check, probed end to end on a copy
      # of the app with banned dependencies added.
      - run: scripts/check-no-google.sh
      - run: scripts/test-no-google-probes.sh
      - run: flutter build apk --debug
      # Gradle dependency locking (android/app/gradle.lockfile): the committed lock is what the app
      # resolves now. The F-Droid graph's lock needs android/third_party/m2, which CI does not have,
      # so scripts/check-fdroid-lock.sh checks it as text in the quick `mobile` job.
      - run: scripts/check-gradle-locks.sh
      # The Kotlin side on the JVM (Robolectric, from Maven Central): the widget's rendering and
      # refresh job, the notices, the voice model unzip, the haptics. After the debug build, which
      # writes android/local.properties and the gradlew script (neither is committed; the wrapper jar is).
      - run: ./gradlew :app:testDebugUnitTest --console=plain
        working-directory: apps/mobile/android
      # The switch F-Droid builds with (Vosk and JNA from source, scripts/build-native-deps.sh): off,
      # Maven's artifacts; on with nothing built, a clear stop; on with built ones, only those.
      - run: scripts/test-native-switch.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: apps/mobile/build/app/reports/tests
          retention-days: 7
      # scripts/release.sh end to end on this runner, with a key made up for the occasion (the real
      # one lives only on the founder's Mac and never reaches CI): unsigned split build, apksigner,
      # verification, and the fingerprint in the ANDROID_CERT_SHA256 format. Last, because it cleans.
      - name: scripts/release.sh, with a throwaway key
        run: |
          export WAMBITO_KEYSTORE="$RUNNER_TEMP/throwaway.p12"
          export WAMBITO_KEY_ALIAS="ci-throwaway"
          WAMBITO_KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$WAMBITO_KEYSTORE_PASSWORD"
          export WAMBITO_KEYSTORE_PASSWORD
          keytool -genkeypair -keystore "$WAMBITO_KEYSTORE" -storetype PKCS12 \
            -alias "$WAMBITO_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Wambito CI throwaway" -storepass:env WAMBITO_KEYSTORE_PASSWORD
          scripts/release.sh --out "$RUNNER_TEMP/dist"
          rm -f "$WAMBITO_KEYSTORE"
      # The Play bundle (release.sh --play): a second throwaway key as the upload key, the AAB signed
      # with jarsigner and read back with aapt2; then the app key as upload key must be refused.
      - name: scripts/release.sh --play, with throwaway keys
        run: |
          keys="$RUNNER_TEMP/play-keys"
          mkdir -p "$keys"
          WAMBITO_KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$WAMBITO_KEYSTORE_PASSWORD"
          export WAMBITO_KEYSTORE_PASSWORD WAMBITO_UPLOAD_KEYSTORE_PASSWORD="$WAMBITO_KEYSTORE_PASSWORD"
          for alias in ci-app ci-upload; do
            keytool -genkeypair -keystore "$keys/$alias.p12" -storetype PKCS12 \
              -alias "$alias" -keyalg RSA -keysize 2048 -validity 2 \
              -dname "CN=Wambito CI throwaway $alias" -storepass:env WAMBITO_KEYSTORE_PASSWORD
          done
          export WAMBITO_KEYSTORE="$keys/ci-app.p12" WAMBITO_KEY_ALIAS=ci-app
          export WAMBITO_UPLOAD_KEYSTORE="$keys/ci-upload.p12" WAMBITO_UPLOAD_KEY_ALIAS=ci-upload
          scripts/release.sh --play --no-clean --out "$RUNNER_TEMP/dist-play"
          aab="$(ls "$RUNNER_TEMP"/dist-play/*/wambito-*.aab)"
          grep -q "  $(basename "$aab")\$" "$(dirname "$aab")/SHA256SUMS"
          export WAMBITO_UPLOAD_KEYSTORE="$keys/ci-app.p12" WAMBITO_UPLOAD_KEY_ALIAS=ci-app
          if scripts/release.sh --play --no-clean --out "$RUNNER_TEMP/dist-same" 2>"$keys/same.log"; then
            echo "release.sh --play signed the bundle with the app key"; exit 1
          fi
          grep -q "signed with the app key" "$keys/same.log"
          rm -rf "$keys"
      # The release APK release.sh just signed asks for INTERNET and for no permission nobody chose,
      # and About can list a licence for every Dart package (Flutter collects them into NOTICES.Z).
      - name: The release APK's permissions and licences
        run: |
          apk="$(ls "$RUNNER_TEMP"/dist/*/wambito-*-arm64-v8a.apk)"
          scripts/check-permissions.sh --apk "$apk"
          scripts/check-licenses.sh --apk "$apk"

  # The Android app on an emulator, against the dev stack (docs/mobile/setup.md, "Integration tests
  # against the dev stack"). A job of its own: it takes longest, and a slow emulator should not hold
  # up the quick checks above. Same filter, so it is skipped (which counts as passing) when nothing
  # the app depends on changed. Debug builds carry x86_64 for this x86_64 AOSP image (no Google
  # services, no ARM translation). Linux runners have KVM; the emulator needs it enabled for the runner
  # user. The AVD is cached after its first boot (the snapshot step).
  mobile-emulator:
    needs: mobile-changes
    if: needs.mobile-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: mobile-emulator-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # No E2E_NOW here, unlike the e2e job: the emulator's clock is the real one, and every test
    # creates its own data from the device's today, so the API must run on the real clock too.
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Read the pinned Flutter version
        id: flutter-version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # sherpa-onnx's AAR, for the debug build the tests install (docs/mobile/setup.md).
      - run: scripts/fetch-sherpa-onnx.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-emulator-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'apps/mobile/pubspec.lock') }}
          restore-keys: gradle-emulator-${{ runner.os }}-
      # The dev stack, as in the e2e job but on the real clock: Postgres, Mailpit and the API
      # (which applies the migrations on start), with the development defaults. The emulator
      # reaches it at 10.0.2.2.
      - name: Start the dev stack
        working-directory: .
        run: |
          cp .env.example .env
          docker compose up -d --build
          for attempt in $(seq 1 60); do
            # The API answers, and Mailpit is up.
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1 && curl -fsS http://localhost:8025/api/v1/info >/dev/null 2>&1; then
              echo "The dev stack is up"
              exit 0
            fi
            sleep 2
          done
          docker compose logs api
          echo "::error::The dev stack did not come up in 2 minutes"
          exit 1
      - name: Cache the AVD
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api36-default-x86_64-nexus6-v1
      - name: Create the AVD and its snapshot (first run only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: Nexus 6
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: echo "Generated the AVD snapshot for caching."
      - name: Integration tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: Nexus 6
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
